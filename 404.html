<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Lucas Leal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Portf-lio/assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    try { var t = localStorage.getItem('ll-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/Portf-lio/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: var(--gutter); }
    .nf__code { font-size: clamp(5rem, 3rem + 10vw, 9rem); font-weight: 600; letter-spacing: -0.06em; line-height: 1; }
    .nf__code span { color: var(--accent); }
    .nf p { color: var(--text-muted); margin: 1rem auto 2rem; max-width: 40ch; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="section__index mono">GET /404 · Not Found</p>
      <h1 class="nf__code">4<span>0</span>4</h1>
      <p>Esta rota não existe. Talvez o endpoint tenha mudado de lugar.</p>
      <a class="btn btn--primary" href="/Portf-lio/">Voltar ao portfólio</a>
    </div>
  </main>
</body>
</html>
